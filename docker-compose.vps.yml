# Боевой запуск: HTTPS с автоматическим сертификатом перед приложением.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Наружу открыты только 80 и 443. База, auth, доступ к таблицам и файловое
# хранилище остаются во внутренней сети докера.

services:
  caddy:
    # снаружи виден только caddy, а из него — только приложение
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    # ротация как у остальных: якорь из базового файла сюда не дотягивается,
    # а без неё docker пишет лог контейнера без ограничения по размеру
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./docker
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
