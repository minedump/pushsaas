# Маршрутизатор Supabase-совместимых путей: supabase-js обращается к одному
# адресу, а за ним несколько разных сервисов. В полной сборке Supabase эту
# роль играет Kong — здесь достаточно nginx (тот же приём, что и в puller).
server {
    listen 8000;
    client_max_body_size 64m;

    # Имена сервисов резолвим на каждый запрос через встроенный DNS докера.
    # Без этого nginx запоминает адрес один раз при старте: стоит пересоздать
    # контейнер PostgREST/auth/хранилища — и шлюз отвечает 502, пока его
    # самого не перезапустят.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS: на VPS браузер и API живут на одном домене (/supabase — тот же
    # ориджин через Caddy, см. docker/Caddyfile), но локальная отладка ходит
    # на отдельный порт (localhost:8000) — без этих заголовков supabase-js
    # получает "Failed to fetch" уже на preflight-запросе. В боевой сборке
    # Supabase (Kong) эти же заголовки на гейтвее стоят по умолчанию.
    # nginx не даёт вынести add_header/if на уровень server поверх location —
    # приходится повторять в каждом (map/if вне location тут не работают).
    #
    # GoTrue сам добавляет Access-Control-Allow-Origin: * (+ Credentials) —
    # вместе с нашим get два заголовка с одним именем в ответе, и браузер
    # ЛЮБОЙ CORS-ответ с дублем целиком бракует (та же ошибка "no header
    # present", даже если один из двух валиден). proxy_hide_header убирает
    # версию апстрима, остаётся только наша, согласованная с реальным Origin.

    # таблицы и RPC: /rest/v1/<table|rpc/fn> → PostgREST
    location /rest/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, accept-profile, content-profile, prefer, range" always;
        if ($request_method = OPTIONS) {
            # add_header из тела location сюда не наследуется (return внутри
            # if обрывает обработку раньше, чем nginx применяет унаследованные
            # заголовки) — раз браузер требует их именно на preflight-ответе,
            # дублируем явно, а не полагаемся на наследование.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        set $rest_upstream rest;
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass http://$rest_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        proxy_set_header Prefer $http_prefer;
        proxy_set_header Range $http_range;
    }

    # файлы медиатеки/иконок манифеста: /storage/v1/... → storage-api
    location /storage/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, accept-profile, content-profile, prefer, range" always;
        if ($request_method = OPTIONS) {
            # add_header из тела location сюда не наследуется (return внутри
            # if обрывает обработку раньше, чем nginx применяет унаследованные
            # заголовки) — раз браузер требует их именно на preflight-ответе,
            # дублируем явно, а не полагаемся на наследование.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        set $storage_upstream storage;
        rewrite ^/storage/v1/(.*) /$1 break;
        proxy_pass http://$storage_upstream:5000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_request_buffering off;
    }

    # вход/регистрация/сессии: /auth/v1/... → GoTrue
    location /auth/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, accept-profile, content-profile, prefer, range" always;
        if ($request_method = OPTIONS) {
            # add_header из тела location сюда не наследуется (return внутри
            # if обрывает обработку раньше, чем nginx применяет унаследованные
            # заголовки) — раз браузер требует их именно на preflight-ответе,
            # дублируем явно, а не полагаемся на наследование.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        set $auth_upstream auth;
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass http://$auth_upstream:9999;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
